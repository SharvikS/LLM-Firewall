<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    body { width:260px; font-family:-apple-system,Segoe UI,Roboto,sans-serif; background:#0d1014; color:#e8eaed; margin:0; padding:14px; }
    h1 { font-size:14px; margin:0 0 2px; }
    .sub { font-size:11px; color:#9aa3b2; margin:0 0 12px; }
    .toggle { display:flex; align-items:center; justify-content:space-between; font-size:13px; font-weight:600;
              background:#13161c; border:1px solid #242a33; border-radius:9px; padding:10px 12px; margin-bottom:10px; }
    .state { font-size:11px; }
    .on { color:#4ade80; } .off { color:#f87171; }
    .link { font-size:12px; color:#60a5fa; cursor:pointer; text-decoration:none; }
    .engine { font-size:11px; color:#7e879a; margin-top:8px; }
    .stats { display:flex; gap:6px; margin:4px 0 10px; }
    .stat { flex:1; background:#13161c; border:1px solid #242a33; border-radius:9px; padding:8px 6px; text-align:center; }
    .stat .n { font-size:16px; font-weight:700; }
    .stat .l { font-size:9px; color:#7e879a; text-transform:uppercase; letter-spacing:.04em; margin-top:2px; }
    .stat.blk .n { color:#f87171; } .stat.red .n { color:#fbbf24; } .stat.ovr .n { color:#9aa3b2; }
    .recent { font-size:11px; color:#7e879a; }
    .recent .hdr { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
    .recent .clear { font-size:10px; color:#60a5fa; cursor:pointer; }
    .ev { display:flex; gap:6px; align-items:center; padding:4px 0; border-top:1px solid #1a1f27; }
    .ev .dot { width:6px; height:6px; border-radius:50%; flex:0 0 auto; }
    .ev .dot.blocked { background:#f87171; } .ev .dot.redacted { background:#fbbf24; } .ev .dot.sent_anyway { background:#9aa3b2; }
    .ev .site { color:#c7ccd6; font-weight:600; text-transform:capitalize; }
    .ev .rsn { color:#7e879a; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; }
    .empty { font-size:11px; color:#5b6472; padding:6px 0; }
  </style>
</head>
<body>
  <h1>TITAN LLM Firewall</h1>
  <p class="sub">Browser DLP for ChatGPT · Claude · Gemini</p>
  
  <div id="site-status" style="display:none; padding:8px; margin-bottom:12px; border-radius:6px; font-size:12px; font-weight:bold; text-align:center;"></div>

  <label class="toggle">
    <span>Protection</span>
    <span><input type="checkbox" id="enabled" /> <span class="state" id="state"></span></span>
  </label>

  <div class="stats">
    <div class="stat blk"><div class="n" id="s-blocked">0</div><div class="l">Blocked</div></div>
    <div class="stat red"><div class="n" id="s-redacted">0</div><div class="l">Redacted</div></div>
    <div class="stat ovr"><div class="n" id="s-overridden">0</div><div class="l">Override</div></div>
  </div>

  <div class="recent">
    <div class="hdr"><span>Recent activity</span><span class="clear" id="clear">Clear</span></div>
    <div id="events"></div>
  </div>

  <div class="engine" id="engine">engine: …</div>
  <p style="margin-top:12px;"><a class="link" id="opts">Settings →</a></p>
  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
