<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    body { width:240px; font-family:-apple-system,Segoe UI,Roboto,sans-serif; background:#0d1014; color:#e8eaed; margin:0; padding:14px; }
    h1 { font-size:14px; margin:0 0 2px; }
    .sub { font-size:11px; color:#9aa3b2; margin:0 0 12px; }
    .toggle { display:flex; align-items:center; justify-content:space-between; font-size:13px; font-weight:600;
              background:#13161c; border:1px solid #242a33; border-radius:9px; padding:10px 12px; margin-bottom:10px; }
    .state { font-size:11px; }
    .on { color:#4ade80; } .off { color:#f87171; }
    .link { font-size:12px; color:#60a5fa; cursor:pointer; text-decoration:none; }
    .engine { font-size:11px; color:#7e879a; margin-top:8px; }
  </style>
</head>
<body>
  <h1>TITAN LLM Firewall</h1>
  <p class="sub">Browser DLP for ChatGPT · Claude · Gemini</p>
  <label class="toggle">
    <span>Protection</span>
    <span><input type="checkbox" id="enabled" /> <span class="state" id="state"></span></span>
  </label>
  <div class="engine" id="engine">engine: …</div>
  <p style="margin-top:12px;"><a class="link" id="opts">Settings →</a></p>
  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
